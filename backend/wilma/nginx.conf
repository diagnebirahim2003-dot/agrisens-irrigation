events {}

http {
  server {
    listen 1027;

    # CORS : Orion ne gère pas lui-même le CORS, et l'en-tête personnalisé
    # ngrok-skip-browser-warning force un preflight que ni Orion ni Keycloak
    # ne savent autoriser par défaut. Nginx répond donc lui-même aux OPTIONS.
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, ngrok-skip-browser-warning" always;
        add_header Access-Control-Max-Age 3600;
        return 204;
      }

      auth_request /validate;
      auth_request_set $auth_user $upstream_http_x_user;

      add_header Access-Control-Allow-Origin $http_origin always;

      proxy_pass http://orion:1026;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header FIWARE-Service agrotic;
    }

    location = /validate {
      internal;
      proxy_pass http://wilma-auth:4000/validate;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-Authorization $http_authorization;
    }

    # Expose Keycloak (realm agrotic) sur le même point d'entrée que Wilma,
    # pour n'avoir besoin que d'un seul tunnel public (ngrok, etc.) côté client.
    # Les OPTIONS sont répondues directement par nginx (Keycloak n'autorise pas
    # l'en-tête ngrok-skip-browser-warning dans son propre CORS) ; les vraies
    # requêtes sont relayées telles quelles, Keycloak gère leur CORS via webOrigins.
    location /realms/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, ngrok-skip-browser-warning" always;
        add_header Access-Control-Max-Age 3600;
        return 204;
      }

      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
